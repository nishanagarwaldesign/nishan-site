# /etc/nginx/sites-available/nishz.com  (VPS route only)
server {
    listen 80;
    listen [::]:80;
    server_name nishz.com www.nishz.com;
    return 301 https://nishz.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nishz.com;

    # certbot fills these in
    ssl_certificate     /etc/letsencrypt/live/nishz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nishz.com/privkey.pem;

    root /var/www/nishz.com;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
